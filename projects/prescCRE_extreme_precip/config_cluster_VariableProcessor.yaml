#  --diag_connect <bool>
# When the data is on a structured grid, consider grid cells to be connected
# in the diagonal (across the vertex).
diag_connect: false

#  --timefilter <string> ""
# A regular expression used to match only those time values to be retained.
# Default values:
# -> 3hr: Filter every 3 hourly (equivalent to "....-..-.. (00|03|06|09|12|15|18|21):00:00").
# -> 6hr: Filter every 6 hourly (equivalent to "....-..-.. (00|06|12|18):00:00").
# -> daily: Filter daily (equivalent to "....-..-.. 00:00:00").
timefilter: ""

#  --regional <bool>
# Used to indicate that a given latitude-longitude grid should not be periodic
# in the longitudinal direction.
regional: false

#  --lonname <string> "lon"
# Name of the longitude variable in the data files.
lonname: "lon"

#  --latname <string> "lat"
# Name of the latitude variable in the data files.
latname: "lat"

#  --verbosity <integer> [0]
# Set the verbosity level of execution.
verbosity: 0

#  --preserve <string> "var1;var2;..."
# A comma-separated list of variables to copy from the input data to the output
# data.
preserve: ""

#  --var <variable> ""
# A comma-separated list of variables that will be processed by this command.
var: "_PROD(FLNT,binary_tag),_PROD(FLNTC,binary_tag),binary_tag"

#  --varout <string> ""
# An optional comma-separated list of variables of the same length as --var
# that replaces these variables in the output data. By default this argument is
# identical to --var.
varout: "ctFLNT,ctFLNTC,binary_tag"

#  --fillvalue <string> "<value>|nan|att"
# Add the specified _FillValue attribute to all output variables. If set to att then the value of this attribute will be inherited from the input data, if present.
fillvalue: "att"

